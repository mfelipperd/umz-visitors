<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin | Umz Visitors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#003058',
            accent: '#FFCB05',
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-['Outfit'] antialiased">

  <div class="flex min-h-screen">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-primary text-white p-6 hidden md:flex flex-col gap-8 shadow-xl">
      <div class="flex items-center gap-2 px-2">
        <div class="w-8 h-8 bg-accent rounded-full flex items-center justify-center text-primary"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
        <span class="font-bold text-lg">Admin View</span>
      </div>
      
      <nav class="flex flex-col gap-2">
        <button onclick="showTab('analytics')" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-left w-full group">
          <i data-lucide="bar-chart-3" class="w-5 h-5 text-accent"></i>
          <span data-i18n="analytics">Análise</span>
        </button>
        <button onclick="showTab('members')" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-left w-full group">
          <i data-lucide="users" class="w-5 h-5 text-accent"></i>
          <span data-i18n="members">Membros</span>
        </button>
      </nav>

      <div class="mt-auto border-t border-white/10 pt-6">
        <div class="flex items-center gap-3 px-4">
          <i data-lucide="globe" class="w-5 h-5 text-blue-300"></i>
          <select id="lang-select" class="bg-transparent text-sm focus:outline-none cursor-pointer">
            <option value="pt" class="text-primary">Português</option>
            <option value="en" class="text-primary">English</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
      
      <header class="mb-12 flex justify-between items-center">
        <h1 id="tab-title" class="text-3xl font-bold text-primary" data-i18n="analytics">Análise de Visitas</h1>
        <div class="md:hidden">
          <button class="p-2 rounded-lg bg-white shadow-sm"><i data-lucide="menu"></i></button>
        </div>
      </header>

      <!-- Analytics Tab -->
      <section id="tab-analytics" class="space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-2">
            <span class="text-sm font-medium text-gray-500" data-i18n="totalVisits">Total de Visitas</span>
            <span id="total-visits-count" class="text-4xl font-bold text-primary">0</span>
          </div>
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-2">
            <span class="text-sm font-medium text-gray-500" data-i18n="adventistVisitors">Adventistas</span>
            <span id="adventist-count" class="text-4xl font-bold text-blue-600">0</span>
          </div>
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-2">
            <span class="text-sm font-medium text-gray-500" data-i18n="nonAdventistVisitors">Outras</span>
            <span id="non-adventist-count" class="text-4xl font-bold text-orange-500">0</span>
          </div>
        </div>
        
        <!-- Visit Logs Placeholder -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
          <h2 class="text-xl font-bold text-primary mb-6" data-i18n="totalVisits">Logs</h2>
          <div id="visit-logs" class="space-y-4">
            <p class="text-gray-400 italic" data-i18n="noData">Carregando dados...</p>
          </div>
        </div>
      </section>

      <!-- Members Tab -->
      <section id="tab-members" class="hidden space-y-8">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-primary" data-i18n="members">Lista de Membros</h2>
          <button onclick="toggleMemberModal()" class="btn-accent py-2 flex items-center gap-2 text-sm shadow-none">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span data-i18n="addMember">Novo</span>
          </button>
        </div>

        <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
          <table class="w-full text-left">
            <thead class="bg-gray-50 border-b border-gray-100">
              <tr>
                <th class="px-6 py-4 text-sm font-semibold text-gray-500" data-i18n="memberName">Nome</th>
                <th class="px-6 py-4 text-sm font-semibold text-gray-500" data-i18n="memberAge">Idade</th>
                <th class="px-6 py-4 text-sm font-semibold text-gray-500" data-i18n="memberPhone">WhatsApp</th>
                <th class="px-6 py-4 text-sm font-semibold text-gray-500" data-i18n="active">Status</th>
                <th class="px-6 py-4 text-sm font-semibold text-gray-500"></th>
              </tr>
            </thead>
            <tbody id="member-list-body" class="divide-y divide-gray-50">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Member Modal -->
  <div id="member-modal" class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 md:p-12 shadow-2xl relative animate-fade-in">
      <button onclick="toggleMemberModal()" class="absolute top-6 right-6 text-gray-300 hover:text-gray-600 transition-colors"><i data-lucide="x"></i></button>
      
      <h2 class="text-2xl font-bold text-primary mb-8" data-i18n="addMember">Novo Membro</h2>
      
      <form id="member-form" class="space-y-6">
        <input type="hidden" id="edit-member-id">
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-500 ml-1" data-i18n="memberName">Nome</label>
          <input type="text" id="member-name" required class="input-field">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-500 ml-1" data-i18n="memberAge">Idade</label>
            <input type="number" id="member-age" required class="input-field">
          </div>
          <div class="space-y-2 flex flex-col">
            <label class="text-sm font-medium text-gray-500 ml-1" data-i18n="active">Ativo?</label>
            <div class="flex items-center gap-2 mt-3 ml-2">
              <input type="checkbox" id="member-active" checked class="w-5 h-5 accent-accent">
            </div>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-500 ml-1" data-i18n="memberPhone">WhatsApp</label>
          <input type="text" id="member-phone" required placeholder="5511999999999" class="input-field">
        </div>
        <button type="submit" class="btn-primary w-full py-4 mt-4" data-i18n="save">Salvar</button>
      </form>
    </div>
  </div>

  <script src="admin.js" type="module"></script>
  <script>
    function showTab(tabId) {
      document.getElementById('tab-analytics').classList.toggle('hidden', tabId !== 'analytics');
      document.getElementById('tab-members').classList.toggle('hidden', tabId !== 'members');
      document.getElementById('tab-title').setAttribute('data-i18n', tabId);
      
      // Re-trigger i18n update for title
      const event = new CustomEvent('tabChanged', { detail: tabId });
      window.dispatchEvent(event);
    }
    
    function toggleMemberModal() {
      const modal = document.getElementById('member-modal');
      const isHidden = modal.classList.toggle('hidden');
      if (isHidden) {
        document.getElementById('member-form').reset();
        document.getElementById('edit-member-id').value = '';
      }
    }
    
    lucide.createIcons();
  </script>
</body>
</html>
